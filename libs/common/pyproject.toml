[project]
name = "tesla-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi~=0.115",
  "sqlalchemy[asyncio]~=2.0",
  "aiosqlite~=0.20",
  "aio-pika~=9.4",
  "redis~=5.0",
  "httpx~=0.27",
  "pyjwt[crypto]~=2.9",
  "pydantic~=2.8",
  "pydantic-settings~=2.4",
]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tesla_common"]
